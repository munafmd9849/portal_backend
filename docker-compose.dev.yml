name: portal-main-dev

# ============================================================
# COMMON LOGGING
# ============================================================

x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"


# ============================================================
# SERVICES
# ============================================================

services:

  # ==========================================================
  # PLACEMENT PORTAL - POSTGRESQL
  # ==========================================================

  postgres-db:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: placement_portal

    ports:
      - "5432:5432"

    volumes:
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d placement_portal"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

    networks:
      - portal-network

    <<: *default-logging


  # ==========================================================
  # PLACEMENT PORTAL - REDIS
  # ==========================================================

  redis-cache:
    image: redis:7-alpine
    container_name: portal-redis
    restart: always

    volumes:
      - redisdata:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping"
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

    networks:
      - portal-network

    <<: *default-logging


  # ==========================================================
  # PLACEMENT PORTAL - BACKEND
  #
  # Development:
  # Builds directly from ./backend/Dockerfile
  # ==========================================================

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: munafmd9849/placement-portal-backend:dev

    container_name: portal-backend
    restart: always

    ports:
      - "3000:3000"

    environment:

      # --------------------------------------------------------
      # Application
      # --------------------------------------------------------

      PORT: "3000"
      NODE_ENV: production

      CORS_ORIGIN: "http://localhost:5173"
      FRONTEND_URL: "http://localhost:5173"


      # --------------------------------------------------------
      # Authentication Users
      # --------------------------------------------------------

      SUPER_ADMIN_EMAIL: "admin@pwioi.in"
      SUPER_ADMIN_PASSWORD: "admin123"

      ADMIN_EMAIL: "munafmd9849@gmail.com"
      ADMIN_PASSWORD: "qwert123"

      STUDENT_EMAIL: "munafmd7407@gmail.com"
      STUDENT_PASSWORD: "qwert123"


      # --------------------------------------------------------
