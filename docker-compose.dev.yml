version: "3.9"

services:
  # ==========================================
  # PostgreSQL Database
  # ==========================================
  postgres-db:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: placement_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d placement_portal"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # ==========================================
  # Redis Cache
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: portal-redis
    restart: always
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # ==========================================
  # Backend API (Development Build)
  # ==========================================
  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: munafmd9849/placement-portal-backend:dev
    container_name: portal-backend
    restart: always

    ports:
      - "3000:3000"

    environment:
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173

