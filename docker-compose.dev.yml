# =============================================================================
# PWIOI Placement Portal — local full stack (development)
#
# Build and run everything locally (Postgres, Redis, Judge0, API, worker, UI):
#   cp backend/.env.example backend/.env   # edit as needed
#   docker compose -f docker-compose.dev.yml up -d --build
#
# Optional seed (NOT run on every startup):
#   docker compose -f docker-compose.dev.yml --profile seed run --rm db-seed
# =============================================================================

name: placement-portal-dev

x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"

x-backend-common: &backend-common
  build:
    context: ./backend
    dockerfile: Dockerfile
  env_file:
    - ./backend/.env
  networks:
    - portal-network
  restart: unless-stopped
  <<: *default-logging

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root123}
      POSTGRES_DB: placement_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d placement_portal"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - portal-network
    <<: *default-logging

  redis-cache:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - portal-network
    <<: *default-logging

  judge0-db:
    image: postgres:16-alpine
    container_name: judge0-db
    restart: unless-stopped
    env_file:
      - ./judge0/judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    networks:
      judge0-internal:
        aliases:
          - db
    <<: *default-logging

  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    restart: unless-stopped
    env_file:
      - ./judge0/judge0.conf
    command:
      [
        "sh",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    networks:
      judge0-internal:
        aliases:
          - redis
    <<: *default-logging

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    restart: unless-stopped
    privileged: true
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    networks:
      - portal-network
      - judge0-internal
    <<: *default-logging

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    restart: unless-stopped
    privileged: true
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    networks:
      - judge0-internal
    <<: *default-logging

  backend-api:
    <<: *backend-common
    container_name: portal-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-root123}@postgres-db:5432/placement_portal
      REDIS_URL: redis://redis-cache:6379
      JUDGE0_ENABLED: "true"
      JUDGE0_PROVIDER: selfhosted
      JUDGE0_API_URL: http://judge0-server:2358
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RUN_SCHEMA_SYNC: "true"
      PRISMA_SCHEMA_SYNC: push
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      judge0-server:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  backend-worker:
    <<: *backend-common
    container_name: portal-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-root123}@postgres-db:5432/placement_portal
      REDIS_URL: redis://redis-cache:6379
      RUN_SCHEMA_SYNC: "false"
    command: ["npm", "run", "worker"]
    depends_on:
      backend-api:
        condition: service_healthy

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
        VITE_API_URL: ${VITE_API_BASE_URL:-http://localhost:3000/api}
        VITE_SOCKET_URL: ${VITE_SOCKET_URL:-http://localhost:3000}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
        VITE_JITSI_DOMAIN: ${VITE_JITSI_DOMAIN:-meet.jit.si}
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - portal-network
    <<: *default-logging

  db-seed:
    <<: *backend-common
    profiles: [seed]
    container_name: portal-db-seed
    restart: "no"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-root123}@postgres-db:5432/placement_portal
      RUN_SCHEMA_SYNC: "true"
      PRISMA_SCHEMA_SYNC: push
    command: ["node", "seed-all.js"]
    depends_on:
      postgres-db:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  judge0-data:

networks:
  portal-network:
    driver: bridge
  judge0-internal:
    driver: bridge
