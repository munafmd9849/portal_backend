# =============================================================================
# PWIOI Placement Portal — developer build & publish
#
# Build local images (includes latest code changes):
#   docker compose -f docker-compose.dev.yml build
#
# Run full stack from local builds:
#   docker compose -f docker-compose.dev.yml up -d
#
# Publish to Docker Hub (after build):
#   docker compose -f docker-compose.dev.yml push
# =============================================================================

name: placement-portal

x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"

configs:
  judge0_conf:
    content: |
      REDIS_HOST=redis
      REDIS_PASSWORD=2rx2LZgGJfnqSjHAq7T5nEXwWat5cRuY
      POSTGRES_HOST=db
      POSTGRES_DB=judge0
      POSTGRES_USER=judge0
      POSTGRES_PASSWORD=4CKnPySHkLKabKqfh2RXDWFxDssYHu9f

services:

  postgres-db:
    image: postgres:16-alpine
    container_name: portal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: placement_portal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d placement_portal"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - portal-network
    <<: *default-logging

  redis-cache:
    image: redis:7-alpine
    container_name: portal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - portal-network
    <<: *default-logging

  judge0-db:
    image: postgres:16-alpine
    container_name: judge0-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: 4CKnPySHkLKabKqfh2RXDWFxDssYHu9f
    volumes:
      - judge0-data:/var/lib/postgresql/data
    networks:
      judge0-internal:
        aliases:
          - db
    <<: *default-logging

  judge0-redis:
    image: redis:7-alpine
    container_name: judge0-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: 2rx2LZgGJfnqSjHAq7T5nEXwWat5cRuY
    command:
      [
        "sh",
        "-c",
        "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""
      ]
    networks:
      judge0-internal:
        aliases:
          - redis
    <<: *default-logging

  judge0-server:
    image: mrkushalsm/judge0:latest
    container_name: judge0-server
    restart: unless-stopped
    privileged: true
    cgroup: host
    ports:
      - "2358:2358"
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    configs:
      - source: judge0_conf
        target: /judge0.conf
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    networks:
      - portal-network
      - judge0-internal
    <<: *default-logging

  judge0-workers:
    image: mrkushalsm/judge0:latest
    container_name: judge0-workers
    restart: unless-stopped
    privileged: true
    cgroup: host
    command: ["./scripts/workers"]
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    configs:
      - source: judge0_conf
        target: /judge0.conf
    depends_on:
      judge0-db:
        condition: service_started
      judge0-redis:
        condition: service_started
    networks:
      - judge0-internal
    <<: *default-logging

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: munafmd9849/placement-portal-backend:1.0.4
    container_name: portal-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      NODE_ENV: production
      CORS_ORIGIN: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
      SUPER_ADMIN_EMAIL: admin@pwioi.in
      SUPER_ADMIN_PASSWORD: admin123
      ADMIN_EMAIL: munafmd9849@gmail.com
      ADMIN_PASSWORD: qwert123
      STUDENT_EMAIL: munafmd7407@gmail.com
      STUDENT_PASSWORD: qwert123
      DATABASE_URL: postgresql://postgres:root123@postgres-db:5432/placement_portal
      REDIS_URL: redis://redis-cache:6379
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
      JUDGE0_ENABLED: "true"
      JUDGE0_PROVIDER: selfhosted
      JUDGE0_API_URL: http://judge0-server:2358
      JWT_SECRET: dev_9fA3xKQpT2mW8ZrE6YJH5sD0C1BvN4L
      JWT_REFRESH_SECRET: dev-refresh-secret-key-min-32-characters-long-change-in-production
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_EXPIRES_IN: 7d
      EMAIL_HOST: smtp.gmail.com
      EMAIL_PORT: "587"
      EMAIL_SECURE: "false"
      EMAIL_USER: charansai82140@gmail.com
      EMAIL_PASS: "yswj utrj jdyt srkq"
      EMAIL_FROM: "PWIOI Portal <charansai82140@gmail.com>"
      AI_PROVIDER: google
      AI_ENABLED: "true"
      GOOGLE_AI_API_KEY: AIzaSyB8I8jymJfgcPDuOM2YNRs48tuAgU7TQPs
      GOOGLE_AI_MODEL: gemini-2.5-flash
      GOOGLE_AI_MAX_TOKENS: "2048"
      GOOGLE_AI_TEMPERATURE: "0.7"
      MISTRAL_API_KEY: PnMUBcJ0X3UY6tnoFmhlz26AAM3rqJur
      MISTRAL_MODEL: mistral-large-latest
      GOOGLE_CLIENT_ID: 620332349787-2r8h9nbimor0m9ef7ftjfnrnp6j0bpjt.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      GOOGLE_REDIRECT_URI: http://localhost:3000/api/calendar/oauth/callback
      GOOGLE_AUTH_REDIRECT_URI: http://localhost:3000/api/auth/google-login/callback
      CLOUDINARY_CLOUD_NAME: ds4oikoaf
      CLOUDINARY_API_KEY: "915818672416539"
      CLOUDINARY_API_SECRET: V2c66DUmBOGVkxAl6wx-qYWwvFM
      AWS_ACCESS_KEY_ID: ""
      AWS_SECRET_ACCESS_KEY: ""
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: ""
    command: >
      sh -c "
      npx prisma db push --skip-generate &&
      node seed-all.js &&
      npm start
      "
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      judge0-server:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - portal-network
    <<: *default-logging

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
        VITE_API_URL: http://localhost:3000/api
        VITE_SOCKET_URL: http://localhost:3000
        VITE_GOOGLE_CLIENT_ID: 620332349787-8elql0hf7t3c0mh6kom6md1pt9prdq3q.apps.googleusercontent.com
        VITE_JITSI_DOMAIN: meet.jit.si
    image: munafmd9849/placement-portal-frontend:1.0.4
    container_name: portal-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - portal-network
    <<: *default-logging

volumes:
  pgdata:
  redisdata:
  judge0-data:

networks:
  portal-network:
    driver: bridge
  judge0-internal:
    driver: bridge
