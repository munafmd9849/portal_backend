      judge0-server:
        condition: service_started

    networks:
      - portal-network

    <<: *default-logging


  # ==========================================================
  # PLACEMENT PORTAL - FRONTEND
  #
  # Development:
  # Builds directly from ./frontend/Dockerfile
  # ==========================================================

  frontend-app:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      args:

        # Browser accesses backend through HOST
        VITE_API_BASE_URL: "http://localhost:3000/api"
        VITE_API_URL: "http://localhost:3000/api"
        VITE_SOCKET_URL: "http://localhost:3000"

        # Google OAuth
        VITE_GOOGLE_CLIENT_ID: "620332349787-8elql0hf7t3c0mh6kom6md1pt9prdq3q.apps.googleusercontent.com"

        # Jitsi
        VITE_JITSI_DOMAIN: "meet.jit.si"

    image: munafmd9849/placement-portal-frontend:dev

    container_name: portal-frontend
    restart: always

    ports:
      - "5173:80"

    depends_on:

      backend-api:
        condition: service_started

    networks:
      - portal-network

    <<: *default-logging


  # ==========================================================
  # JUDGE0 - SERVER
  # ==========================================================

  judge0-server:
    image: judge0/judge0:1.13.1

    container_name: judge0-server
    restart: always

    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro

    ports:
      - "2358:2358"

    privileged: true

    depends_on:

      judge0-db:
        condition: service_started

      judge0-redis:
        condition: service_started

    networks:

      portal-network:

      judge0-internal:

    <<: *default-logging


  # ==========================================================
  # JUDGE0 - WORKERS
  # ==========================================================

  judge0-workers:
    image: judge0/judge0:1.13.1

    container_name: judge0-workers
    restart: always

    command:
      - "./scripts/workers"

    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro

    privileged: true

    depends_on:

      judge0-db:
        condition: service_started

      judge0-redis:
        condition: service_started

    networks:
      - judge0-internal

    <<: *default-logging


  # ==========================================================
  # JUDGE0 - POSTGRESQL
  # ==========================================================

  judge0-db:
    image: postgres:16.2

    container_name: judge0-db
    restart: always

    env_file:
      - ./judge0/judge0.conf

    volumes:
      - judge0-data:/var/lib/postgresql/data

    networks:

      judge0-internal:
        aliases:
          - db

    <<: *default-logging


  # ==========================================================
  # JUDGE0 - REDIS
  # ==========================================================

  judge0-redis:
    image: redis:7.2.4

    container_name: judge0-redis
    restart: always

    command:
      [
        "bash",
        "-c",
        "docker-entrypoint.sh --appendonly no --requirepass \"$$REDIS_PASSWORD\""
      ]

    env_file:
      - ./judge0/judge0.conf

    networks:

      judge0-internal:
        aliases:
          - redis

    <<: *default-logging


# ============================================================
# VOLUMES
# ============================================================

volumes:

  # Placement Portal
  pgdata:
  redisdata:

  # Judge0
  judge0-data:


# ============================================================
# NETWORKS
# ============================================================

networks:

  # Shared network:
  #
  # frontend
  # backend
  # portal postgres
  # portal redis
  # judge0 server
  #
  portal-network:
    driver: bridge

  # Judge0-only communication:
  #
  # judge0-server
  # judge0-workers
  # judge0-db
  # judge0-redis
  #
  judge0-internal:
    driver: bridge