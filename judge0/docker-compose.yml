# Standalone Judge0 CE (from commit 4d2514e — Judge0 pieces only).
# Run from this folder:
#   cd judge0 && docker compose up -d
#
# Requirements: Docker Desktop running, port 2358 free, privileged containers allowed.
# Backend on host should use: JUDGE0_API_URL=http://localhost:2358

name: portal-judge0

x-default-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "100m"

services:
  server:
    image: judge0/judge0:1.13.1
    container_name: judge0-server
    restart: always
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "2358:2358"
    privileged: true
    depends_on:
      - db
      - redis
    networks:
      - judge0
    <<: *default-logging

  workers:
    image: judge0/judge0:1.13.1
    container_name: judge0-workers
    restart: always
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - db
      - redis
    networks:
      - judge0
    <<: *default-logging

  db:
    image: postgres:16.2
    container_name: judge0-db
    restart: always
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data
    networks:
      judge0:
        aliases:
          - db
    <<: *default-logging

  redis:
    image: redis:7.2.4
    container_name: judge0-redis
    restart: always
    command:
      [
        "bash",
        "-c",
        'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"',
      ]
    env_file: judge0.conf
    networks:
      judge0:
        aliases:
          - redis
    <<: *default-logging

volumes:
  judge0-data:

networks:
  judge0:
    driver: bridge
