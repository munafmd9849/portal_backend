# Isolated PostgreSQL for E2E — never use production or dev databases.
services:
  postgres-e2e:
    image: postgres:16-alpine
    container_name: portal-e2e-postgres
    environment:
      POSTGRES_USER: ${E2E_POSTGRES_USER:-portal_e2e}
      POSTGRES_PASSWORD: ${E2E_POSTGRES_PASSWORD:-e2e_postgres_pass}
      POSTGRES_DB: ${E2E_POSTGRES_DB:-portal_e2e}
    ports:
      - "${E2E_POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${E2E_POSTGRES_USER:-portal_e2e} -d ${E2E_POSTGRES_DB:-portal_e2e}"]
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
