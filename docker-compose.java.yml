# Run the Java Spring Boot API against local Postgres/Redis from docker-compose.dev.yml
#
#   docker compose -f docker-compose.infra.yml up -d
#   docker compose -f docker-compose.java.yml up -d --build
#
name: placement-portal-java

services:
  api-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: portal-api-java
    env_file:
      - ./backend-java/.env
    environment:
      PORT: 3000
      SOCKET_PORT: 3001
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-root123}@postgres-db:5432/placement_portal
      REDIS_URL: redis://redis-cache:6379
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
