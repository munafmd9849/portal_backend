name: E2E Security Suite

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  jest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  e2e-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
      - run: npx playwright test e2e/specs/p0-*.spec.js e2e/specs/p1-*.spec.js
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-sqlite-report
          path: |
            playwright-report/
            test-results/

  e2e-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: portal_e2e
          POSTGRES_PASSWORD: e2e_postgres_pass
          POSTGRES_DB: portal_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U portal_e2e -d portal_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install chromium --with-deps
      - name: Write Postgres E2E env
        run: |
          cat > backend/.env.e2e.postgres <<'EOF'
          E2E=1
          E2E_DB=postgres
          NODE_ENV=development
          PORT=3100
          DATABASE_URL=postgresql://portal_e2e:e2e_postgres_pass@localhost:5433/portal_e2e
          JWT_SECRET=e2e-jwt-secret-not-for-production
          JWT_REFRESH_SECRET=e2e-refresh-secret-not-for-production
          SUPER_ADMIN_EMAIL=e2e.super@pwioi.test
          E2E_PASSWORD=E2ePass#143
          FRONTEND_URL=http://localhost:5174
          CORS_ORIGIN=http://localhost:5174
          JUDGE0_ENABLED=false
          AI_ENABLED=false
          DISABLE_RATE_LIMIT=true
          EOF
      - run: npm run e2e:seed:postgres
        env:
          E2E_DB: postgres
      - run: npx playwright test e2e/specs/p0-*.spec.js e2e/specs/p1-*.spec.js -c playwright.postgres.config.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-postgres-report
          path: |
            playwright-report/
            test-results/

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
