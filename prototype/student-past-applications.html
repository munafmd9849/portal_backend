<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Applications</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>My Job Applications</h1>
      <p>Track your application status and interview journey</p>
    </div>

    <!-- Applications List -->
    <div class="card">
      <div class="card-title">Application History</div>
      <div id="applicationsList">
        <p style="color: #718096; text-align: center; padding: 20px;">Loading applications...</p>
      </div>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="state.js"></script>
  <script src="utils.js"></script>
  <script>
    function init() {
      loadApplications();
    }

    function loadApplications() {
      const container = document.getElementById('applicationsList');
      const applications = State.applications;

      if (applications.length === 0) {
        container.innerHTML = '<p style="color: #718096; text-align: center; padding: 20px;">No applications found.</p>';
        return;
      }

      const list = document.createElement('div');
      list.className = 'student-list';

      applications.forEach(app => {
        const student = getStudentById(app.studentId);
        if (!student) return;

        const journeyText = Utils.getInterviewJourneyText(app.studentId);
        const statusInfo = State.getStudentApplicationStatus(app.studentId);
        
        // Determine badge class and text
        let badgeClass = 'badge-gray';
        let statusText = 'Applied';

        if (app.status === 'REJECTED') {
          badgeClass = 'badge-red';
          statusText = 'Rejected';
        } else if (app.status === 'RESUME_SHORTLISTED') {
          badgeClass = 'badge-blue';
          statusText = 'Resume Shortlisted';
        } else if (app.status === 'TEST_PASSED') {
          badgeClass = 'badge-green';
          statusText = 'Test Passed';
        } else if (app.status === 'INTERVIEW_ONGOING' || (statusInfo && statusInfo.status === 'INTERVIEW_ONGOING')) {
          badgeClass = 'badge-yellow';
          statusText = 'Interview Ongoing';
        } else if (app.status === 'SELECTED') {
          badgeClass = 'badge-success';
          statusText = 'Selected';
        } else if (app.status.startsWith('REJECTED_IN_ROUND_')) {
          badgeClass = 'badge-red';
          statusText = app.status.replace('REJECTED_IN_ROUND_', 'Rejected in Round ');
        }

        const card = document.createElement('div');
        card.className = 'student-card';
        card.style.cssText = 'flex-direction: column; align-items: stretch; padding: 20px;';

        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 15px;">
            <div style="flex: 1;">
              <h3 style="margin-bottom: 5px; color: #2d3748;">${MOCK_DATA.job.title}</h3>
              <p style="color: #718096; font-size: 14px; margin-bottom: 10px;">${MOCK_DATA.job.company}</p>
              <div style="display: flex; gap: 15px; font-size: 13px; color: #718096;">
                <span>Applied: ${Utils.formatDate(app.appliedDate)}</span>
                ${statusInfo && statusInfo.currentRound ? `
                  <span>Current Round: ${statusInfo.currentRound}</span>
                ` : ''}
              </div>
            </div>
            <div>
              <span class="badge ${badgeClass}">${statusText}</span>
            </div>
          </div>
          
          <div style="background: #f7fafc; padding: 15px; border-radius: 6px; border-left: 4px solid #667eea;">
            <div style="font-size: 13px; color: #4a5568; margin-bottom: 5px; font-weight: 600;">
              Interview Journey:
            </div>
            <div style="font-size: 14px; color: #2d3748;">
              ${journeyText}
            </div>
          </div>

          ${app.status === 'SELECTED' ? `
            <div style="margin-top: 15px; padding: 12px; background: #c6f6d5; border-radius: 6px; border-left: 4px solid #48bb78;">
              <p style="margin: 0; color: #22543d; font-weight: 600; font-size: 14px;">
                🎉 Congratulations! You have been selected for this position.
              </p>
            </div>
          ` : ''}

          ${app.status === 'REJECTED' || app.status.startsWith('REJECTED_IN_ROUND_') ? `
            <div style="margin-top: 15px; padding: 12px; background: #fed7d7; border-radius: 6px; border-left: 4px solid #f56565;">
              <p style="margin: 0; color: #742a2a; font-size: 14px;">
                Your application was not selected for this position. Keep applying!
              </p>
            </div>
          ` : ''}
        `;

        list.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(list);
    }

    // Initialize
    init();

    // Refresh every 2 seconds to catch status updates
    setInterval(() => {
      loadApplications();
    }, 2000);
  </script>
</body>
</html>
