<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Session - Interview Management System</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Session Container */
        .session-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Session Header */
        .session-header {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .session-header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .session-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }
        .info-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            background: #f8fafc;
            border-radius: 8px;
        }
        .info-item strong {
            color: #64748b;
        }

        /* Statistics Panel */
        .stats-panel {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .stats-panel h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1.5rem;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            transition: transform 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
        }
        .stat-card.total { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
        .stat-card.done { background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
        .stat-card.selected { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); }
        .stat-card.onhold { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .stat-card.pending { background: linear-gradient(135deg, #64748b 0%, #475569 100%); }
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .stat-label {
            font-size: 0.875rem;
            opacity: 0.9;
        }

        /* Rounds Section */
        .rounds-section {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .rounds-section h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }
        .round-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            margin-bottom: 1rem;
            transition: all 0.2s;
        }
        .round-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }
        .round-info {
            flex: 1;
        }
        .round-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .round-status {
            display: inline-block;
            padding: 0.375rem 0.875rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
        }
        .round-status.pending {
            background: #fef3c7;
            color: #92400e;
        }
        .round-status.ongoing {
            background: #dbeafe;
            color: #1e40af;
        }
        .round-status.completed {
            background: #d1fae5;
            color: #065f46;
        }
        .round-actions {
            display: flex;
            gap: 0.5rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 500;
            font-size: 0.875rem;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: white;
        }
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        /* Activity Feed */
        .activity-feed {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .activity-feed h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 1.5rem;
        }
        .activity-list {
            max-height: 400px;
            overflow-y: auto;
        }
        .activity-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.2s;
        }
        .activity-item:hover {
            background: #f8fafc;
        }
        .activity-item:last-child {
            border-bottom: none;
        }
        .activity-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            flex-shrink: 0;
        }
        .activity-icon.session-started { background: #dbeafe; }
        .activity-icon.round-started { background: #dbeafe; }
        .activity-icon.round-completed { background: #d1fae5; }
        .activity-icon.evaluation { background: #d1fae5; }
        .activity-icon.session-ended { background: #fee2e2; }
        .activity-content {
            flex: 1;
        }
        .activity-message {
            color: #1e293b;
            font-weight: 500;
            margin-bottom: 0.25rem;
        }
        .activity-time {
            color: #64748b;
            font-size: 0.875rem;
        }

        /* Collapsible Candidate List */
        .candidates-panel {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }
        .candidates-panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 1rem;
        }
        .candidates-panel-header h2 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e293b;
        }
        .candidates-panel-content {
            display: none;
            margin-top: 1rem;
        }
        .candidates-panel-content.active {
            display: block;
        }
        .candidate-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        .candidate-card {
            padding: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f8fafc;
        }
        .candidate-card h4 {
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        .candidate-card p {
            color: #64748b;
            font-size: 0.875rem;
            margin: 0.25rem 0;
        }
    </style>
</head>
<body>
    <div class="session-container">
        <!-- Session Header -->
        <div class="session-header">
            <h1>🎯 Interview Session</h1>
            <div class="session-info">
                <div class="info-item">
                    <strong>Job:</strong> <span id="jobTitle">-</span>
                </div>
                <div class="info-item">
                    <strong>Company:</strong> <span id="companyName">-</span>
                </div>
                <div class="info-item">
                    <strong>Status:</strong> <span id="sessionStatus">-</span>
                </div>
                <div class="info-item">
                    <strong>Total Candidates:</strong> <span id="totalCandidates">-</span>
                </div>
            </div>
        </div>

        <!-- Statistics Panel -->
        <div class="stats-panel">
            <h2>📊 Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card total">
                    <div class="stat-value" id="statTotal">0</div>
                    <div class="stat-label">Total</div>
                </div>
                <div class="stat-card done">
                    <div class="stat-value" id="statDone">0</div>
                    <div class="stat-label">Done</div>
                </div>
                <div class="stat-card selected">
                    <div class="stat-value" id="statSelected">0</div>
                    <div class="stat-label">Selected</div>
                </div>
                <div class="stat-card onhold">
                    <div class="stat-value" id="statOnHold">0</div>
                    <div class="stat-label">On Hold</div>
                </div>
                <div class="stat-card pending">
                    <div class="stat-value" id="statPending">0</div>
                    <div class="stat-label">Pending</div>
                </div>
            </div>
        </div>

        <!-- Rounds Section -->
        <div class="rounds-section">
            <h2>🔄 Interview Rounds</h2>
            <div id="roundsList">
                <!-- Populated by JavaScript -->
            </div>
        </div>

        <!-- Collapsible Candidate List -->
        <div class="candidates-panel">
            <div class="candidates-panel-header" onclick="toggleCandidatesPanel()">
                <h2>👥 Candidate List</h2>
                <span id="candidatesToggle">▼</span>
            </div>
            <div class="candidates-panel-content" id="candidatesPanelContent">
                <div class="candidate-list" id="candidateList">
                    <!-- Populated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Activity Feed -->
        <div class="activity-feed">
            <h2>📝 Activity Feed</h2>
            <div class="activity-list" id="activityList">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </div>

    <script>
        /**
         * MOCK BACKEND DATA
         * In production, this would be fetched from an API
         */
        let mockSession = {
            id: 'int-001',
            jobTitle: 'Full Stack Developer',
            company: 'Tech Corp',
            status: 'ongoing',
            totalCandidates: 25,
            stats: {
                total: 25,
                done: 8,
                selected: 5,
                onHold: 2,
                pending: 10
            },
            rounds: [
                { id: 'r1', name: 'Technical Round 1', status: 'completed', order: 1 },
                { id: 'r2', name: 'Technical Round 2', status: 'ongoing', order: 2 },
                { id: 'r3', name: 'HR Round', status: 'pending', order: 3 }
            ],
            candidates: [
                { id: 'c1', name: 'John Doe', email: 'john@example.com', status: 'SELECTED' },
                { id: 'c2', name: 'Jane Smith', email: 'jane@example.com', status: 'SELECTED' },
                { id: 'c3', name: 'Bob Johnson', email: 'bob@example.com', status: 'ON_HOLD' },
                { id: 'c4', name: 'Alice Williams', email: 'alice@example.com', status: 'PENDING' }
            ],
            activities: [
                { id: 'a1', type: 'session-started', message: 'Interview session started', time: new Date(Date.now() - 3600000) },
                { id: 'a2', type: 'round-started', message: 'Technical Round 1 started', time: new Date(Date.now() - 3300000) },
                { id: 'a3', type: 'evaluation', message: 'Candidate John Doe evaluated (SELECTED)', time: new Date(Date.now() - 3000000) },
                { id: 'a4', type: 'round-completed', message: 'Technical Round 1 completed', time: new Date(Date.now() - 2400000) },
                { id: 'a5', type: 'round-started', message: 'Technical Round 2 started', time: new Date(Date.now() - 1800000) }
            ]
        };

        /**
         * LOAD SESSION
         * Loads session data from storage or uses mock data
         */
        function loadSession() {
            const stored = sessionStorage.getItem('currentInterview');
            if (stored) {
                const interview = JSON.parse(stored);
                mockSession.jobTitle = interview.jobTitle;
                mockSession.company = interview.company;
                mockSession.totalCandidates = interview.totalCandidates;
            }
            renderSession();
        }

        /**
         * RENDER SESSION
         * Renders all session components
         */
        function renderSession() {
            document.getElementById('jobTitle').textContent = mockSession.jobTitle;
            document.getElementById('companyName').textContent = mockSession.company;
            document.getElementById('sessionStatus').textContent = mockSession.status;
            document.getElementById('totalCandidates').textContent = mockSession.totalCandidates;

            updateStats();
            renderRounds();
            renderCandidates();
            renderActivities();
        }

        /**
         * UPDATE STATISTICS
         * Updates the statistics panel with current data
         */
        function updateStats() {
            document.getElementById('statTotal').textContent = mockSession.stats.total;
            document.getElementById('statDone').textContent = mockSession.stats.done;
            document.getElementById('statSelected').textContent = mockSession.stats.selected;
            document.getElementById('statOnHold').textContent = mockSession.stats.onHold;
            document.getElementById('statPending').textContent = mockSession.stats.pending;
        }

        /**
         * RENDER ROUNDS
         * Renders the rounds list with proper sequential enforcement
         */
        function renderRounds() {
            const roundsList = document.getElementById('roundsList');
            roundsList.innerHTML = '';

            mockSession.rounds.forEach((round, index) => {
                // Sequential enforcement: next round can only start if previous is completed
                const canStart = index === 0 || mockSession.rounds[index - 1].status === 'completed';
                const isOngoing = round.status === 'ongoing';
                const isCompleted = round.status === 'completed';

                const roundDiv = document.createElement('div');
                roundDiv.className = 'round-item';
                roundDiv.innerHTML = `
                    <div class="round-info">
                        <div class="round-name">${round.name}</div>
                        <span class="round-status ${round.status}">${round.status}</span>
                    </div>
                    <div class="round-actions">
                        ${round.status === 'pending' && canStart ? `
                            <button class="btn btn-primary" onclick="startAssessment('${round.id}')">
                                Start Assessment
                            </button>
                        ` : round.status === 'ongoing' ? `
                            <button class="btn btn-primary" onclick="goToAssessment('${round.id}')">
                                Continue Assessment
                            </button>
                        ` : round.status === 'completed' ? `
                            <button class="btn btn-danger" onclick="endRound('${round.id}')" title="Manual override to end round">
                                End Round
                            </button>
                        ` : `
                            <button class="btn btn-primary" disabled title="Previous round must be completed">
                                Start Assessment
                            </button>
                        `}
                    </div>
                `;
                roundsList.appendChild(roundDiv);
            });
        }

        /**
         * START ASSESSMENT
         * Starts an assessment round
         */
        function startAssessment(roundId) {
            const round = mockSession.rounds.find(r => r.id === roundId);
            if (!round) return;

            // Validate sequential progression
            const roundIndex = mockSession.rounds.findIndex(r => r.id === roundId);
            if (roundIndex > 0) {
                const previousRound = mockSession.rounds[roundIndex - 1];
                if (previousRound.status !== 'completed') {
                    alert('Previous round must be completed before starting this round');
                    return;
                }
            }

            // Update round status
            round.status = 'ongoing';
            
            // Add activity
            mockSession.activities.unshift({
                id: 'a' + Date.now(),
                type: 'round-started',
                message: `${round.name} started`,
                time: new Date()
            });

            // Store in sessionStorage
            sessionStorage.setItem('currentSession', JSON.stringify(mockSession));
            sessionStorage.setItem('currentRound', roundId);

            // Redirect to assessment page
            window.location.href = `assessment.html?roundId=${roundId}`;
        }

        /**
         * GO TO ASSESSMENT
         * Continues an ongoing assessment
         */
        function goToAssessment(roundId) {
            sessionStorage.setItem('currentSession', JSON.stringify(mockSession));
            sessionStorage.setItem('currentRound', roundId);
            window.location.href = `assessment.html?roundId=${roundId}`;
        }

        /**
         * END ROUND
         * Manually ends a round (admin override)
         */
        function endRound(roundId) {
            if (!confirm('Are you sure you want to manually end this round?')) {
                return;
            }

            const round = mockSession.rounds.find(r => r.id === roundId);
            if (!round) return;

            // Update round status
            round.status = 'completed';
            
            // Add activity
            mockSession.activities.unshift({
                id: 'a' + Date.now(),
                type: 'round-completed',
                message: `${round.name} completed (manual override)`,
                time: new Date()
            });

            renderRounds();
            renderActivities();
        }

        /**
         * RENDER CANDIDATES
         * Renders the collapsible candidate list
         */
        function renderCandidates() {
            const candidateList = document.getElementById('candidateList');
            candidateList.innerHTML = '';

            mockSession.candidates.forEach(candidate => {
                const card = document.createElement('div');
                card.className = 'candidate-card';
                card.innerHTML = `
                    <h4>${candidate.name}</h4>
                    <p>${candidate.email}</p>
                    <p><strong>Status:</strong> ${candidate.status}</p>
                `;
                candidateList.appendChild(card);
            });
        }

        /**
         * TOGGLE CANDIDATES PANEL
         * Toggles the collapsible candidate list
         */
        function toggleCandidatesPanel() {
            const content = document.getElementById('candidatesPanelContent');
            const toggle = document.getElementById('candidatesToggle');
            content.classList.toggle('active');
            toggle.textContent = content.classList.contains('active') ? '▲' : '▼';
        }

        /**
         * RENDER ACTIVITIES
         * Renders the activity feed
         */
        function renderActivities() {
            const activityList = document.getElementById('activityList');
            activityList.innerHTML = '';

            mockSession.activities.slice(0, 15).forEach(activity => {
                const activityDiv = document.createElement('div');
                activityDiv.className = 'activity-item';
                
                const icon = activity.type === 'session-started' ? '🚀' : 
                            activity.type === 'round-started' ? '▶️' : 
                            activity.type === 'round-completed' ? '✅' :
                            activity.type === 'evaluation' ? '📝' : 
                            activity.type === 'session-ended' ? '🏁' : '📋';

                activityDiv.innerHTML = `
                    <div class="activity-icon ${activity.type}">${icon}</div>
                    <div class="activity-content">
                        <div class="activity-message">${activity.message}</div>
                        <div class="activity-time">${formatTime(activity.time)}</div>
                    </div>
                `;
                activityList.appendChild(activityDiv);
            });
        }

        /**
         * FORMAT TIME
         * Formats timestamp to human-readable format
         */
        function formatTime(date) {
            const now = new Date();
            const diff = now - new Date(date);
            const minutes = Math.floor(diff / 60000);
            if (minutes < 1) return 'Just now';
            if (minutes < 60) return `${minutes}m ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours}h ago`;
            return new Date(date).toLocaleString();
        }

        /**
         * AUTO-REFRESH
         * Simulates real-time updates for activities and stats
         */
        setInterval(() => {
            // Simulate new activities (30% chance)
            if (Math.random() > 0.7) {
                const messages = [
                    'Candidate evaluated',
                    'Status updated',
                    'Round progress updated',
                    'New evaluation submitted'
                ];
                mockSession.activities.unshift({
                    id: 'a' + Date.now(),
                    type: 'evaluation',
                    message: messages[Math.floor(Math.random() * messages.length)],
                    time: new Date()
                });
                renderActivities();
            }
        }, 5000);

        // Initialize on page load
        loadSession();
    </script>
</body>
</html>
