
services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: portal-postgres
    environment:
      POSTGRES_USER: portal_user
      POSTGRES_PASSWORD: portal_password
      POSTGRES_DB: portal_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portal_user -d portal_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: portal-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - portal-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal-backend
    ports:
      - "3000:5000"
    env_file:
      - ./backend/.env.docker
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://portal_user:portal_password@postgres:5432/portal_db
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: docker-local-jwt-secret-change-me
      JWT_REFRESH_SECRET: docker-local-jwt-refresh-secret-change-me
      SUPER_ADMIN_EMAIL: admin@pwioi.in
      JUDGE0_ENABLED: "true"
      JUDGE0_PROVIDER: selfhosted
      JUDGE0_API_URL: http://judge0-server:2358
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - portal-network
    restart: unless-stopped

  # One-time / on-demand auth seed (empty Docker DB). Run: docker compose run --rm seed
  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env.docker
    environment:
      DATABASE_URL: postgresql://portal_user:portal_password@postgres:5432/portal_db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - portal-network
    profiles:
      - seed
    command: ["node", "prisma/seed-auth-users.js"]

  # Frontend App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000/api
        VITE_SOCKET_URL: http://localhost:3000
        VITE_FRONTEND_URL: http://localhost:5173
    container_name: portal-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - portal-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  portal-network:
    driver: bridge
